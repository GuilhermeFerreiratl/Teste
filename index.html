<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador BIP39 - Copia e Cola</title>
<style>
  body { background: #0f0f0f; color: white; font-family: sans-serif; padding: 20px; max-width: 650px; margin: auto; }
  h1 { color: #f7931a; font-size: 22px; text-align: center; }
  button { border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 16px; width: 100%; cursor: pointer; }
  .btn-gerar { background: #f7931a; color: black; }
  .btn-copiar { background: #00c853; color: black; margin-top: 10px; }
  .caixa { background: #1a1a1a; border: 1px solid #333; padding: 16px; border-radius: 12px; margin-top: 15px; }
  .palavra { display: inline-block; background: #2a2a2a; border: 1px solid #444; color: white; padding: 8px 12px; margin: 4px; border-radius: 20px; font-weight: bold; }
  .palavra12 { background: #00c853; color: black; border-color: #00c853; }
  textarea { width: 100%; height: 70px; background: #000; color: #00ff00; border: 1px solid #333; border-radius: 10px; padding: 12px; font-size: 16px; font-family: monospace; box-sizing: border-box; resize: none; }
  .aviso { background: #ff000022; border: 1px solid red; padding: 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  #msg { text-align: center; color: #00ff00; font-weight: bold; margin-top: 8px; min-height: 20px; }
</style>
</head>
<body>

<h1>🟠 Gerador 12 Palavras - BIP39 Real</h1>

<div class="aviso">
⚠️ <b>Só para teste e estudo.</b> Nunca use frase gerada em site online para guardar dinheiro de verdade. Para dinheiro real, use carteira oficial offline.
</div>

<br>
<button class="btn-gerar" onclick="gerar()">GERAR 12 PALAVRAS</button>

<div class="caixa" id="resultado" style="text-align:center; color:#888;">Clique para gerar...</div>

<div class="caixa">
  <b>📋 Copia e cola - pronta:</b><br><br>
  <textarea id="copia" readonly placeholder="Aqui vai aparecer sua frase pronta para copiar..."></textarea>
  <button class="btn-copiar" onclick="copiar()">📋 COPIAR AS 12 PALAVRAS</button>
  <div id="msg"></div>
</div>

<script>
let WORDLIST = [];
let fraseAtual = "";

async function carregarLista() {
  if (WORDLIST.length) return WORDLIST;
  const url = "https://raw.githubusercontent.com/bitcoin/bips/master/bip-0039/english.txt";
  const txt = await (await fetch(url)).text();
  WORDLIST = txt.trim().split("\n");
  return WORDLIST;
}
function bytesToBinary(bytes) {
  return Array.from(bytes).map(b => b.toString(2).padStart(8, '0')).join('');
}
async function sha256(bytes) {
  const hash = await crypto.subtle.digest('SHA-256', bytes);
  return new Uint8Array(hash);
}
async function gerar() {
  const btn = document.querySelector('.btn-gerar');
  btn.innerText = "GERANDO...";
  document.getElementById('msg').innerText = "";
  try {
    const lista = await carregarLista();
    const entropy = new Uint8Array(16);
    crypto.getRandomValues(entropy);
    const hash = await sha256(entropy);
    const hashBits = bytesToBinary(hash);
    const checksum = hashBits.slice(0, 4);
    const bits = bytesToBinary(entropy) + checksum;
    let frase = [];
    for (let i = 0; i < 12; i++) {
      const chunk = bits.slice(i * 11, (i + 1) * 11);
      frase.push(lista[parseInt(chunk, 2)]);
    }
    fraseAtual = frase.join(' ');
    // Mostra bonitinho
    let html = frase.map((p, i) => {
      if (i === 11) return `<span class="palavra palavra12">${i+1}. ${p}</span>`;
      return `<span class="palavra">${i+1}. ${p}</span>`;
    }).join('');
    document.getElementById('resultado').innerHTML = html;
    // Mostra no formato copia e cola
    document.getElementById('copia').value = fraseAtual;
    btn.innerText = "GERAR OUTRA";
  } catch(e) {
    btn.innerText = "GERAR 12 PALAVRAS";
    document.getElementById('resultado').innerHTML = "Erro de internet. Tente de novo.";
  }
}
function copiar() {
  const campo = document.getElementById('copia');
  if (!fraseAtual) {
    document.getElementById('msg').innerText = "Gere primeiro!";
    return;
  }
  campo.select();
  campo.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(fraseAtual).then(() => {
    document.getElementById('msg').innerText = "✅ COPIADO! Agora é só colar onde quiser.";
  }).catch(() => {
    document.execCommand('copy');
    document.getElementById('msg').innerText = "✅ COPIADO!";
  });
}
</script>
</body>
</html>
